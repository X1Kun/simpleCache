name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simplecache-operator/go.mod
          cache: true
          cache-dependency-path: |
            geecache-engine/go.sum
            simplecache-operator/go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Run static analysis
        run: make vet

      - name: Run engine race tests and diagnostic reports
        run: make validate

      - name: Compile engine and Operator
        run: make build

      - name: Validate Compose configuration
        run: make compose-config

      - name: Validate generated files and render Kubernetes manifests
        run: |
          make generated-check
          make k8s-render

      - name: Upload engine reports, profiles and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-validation
          path: bin/reports/
          if-no-files-found: ignore

  operator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simplecache-operator/go.mod
          cache: true
          cache-dependency-path: |
            geecache-engine/go.sum
            simplecache-operator/go.sum

      - name: Run Operator API-server tests
        run: make test-operator-ci

      - name: Upload Operator report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-validation
          path: bin/reports/
          if-no-files-found: ignore
